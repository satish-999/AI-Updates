name: ingest

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Scheduled runs are queued and can be delayed or skipped under platform load.
# Never let two overlap — the pipeline is resumable, so waiting is always safe.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ~90MB. Without this it re-downloads every 15 minutes.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: .models
          key: minilm-l6-v2-v1

      - run: npm ci

      # Stages run in order but resume independently: each finds its work with
      # a SQL predicate and marks done by writing a column, so a failure here
      # just means a larger batch next cycle. always() keeps one bad feed from
      # blocking embedding and clustering.
      - name: "stage 1 - fetch"
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGEST_DEADLINE_MS: "300000"

      - name: "stage 2 - embed"
        if: always()
        run: npm run embed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMBED_DEADLINE_MS: "240000"

      - name: "stage 3 - cluster"
        if: always()
        run: npm run cluster
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: "stage 4 - score"
        if: always()
        run: npm run score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Needs GEMINI_API_KEY in repo secrets. continue-on-error so a missing
      # key or an exhausted free tier never fails the whole pipeline -- the
      # stories simply stay unenriched and the next cycle retries them.
      - name: "stage 5 - enrich"
        if: always()
        continue-on-error: true
        run: npm run enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Canonicalises entities and refreshes story search text. Cheap, and it
      # keeps entity pages from splitting one thing across several names.
      - name: "stage 6 - tidy"
        if: always()
        continue-on-error: true
        run: npm run tidy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: "pipeline status"
        if: always()
        run: npm run status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
